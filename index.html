<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Magical Spell Generator</title>
  </head>
  <body>
    <h1>Welcome to the Magical Spell Generator!</h1>
    <div id="spellArea">
      <button id="generateButton">Generate Spell</button>
      <ul id="ingredientList">
        <li>Dragon Scale</li>
        <li>Phoenix Feather</li>
        <li>Unicorn Horn</li>
      </ul>
      <!-- This element is essential for showing the countdown/spell -->
      <p id="spellMessage">Your spell will appear here...</p>
      <button id="resetButton">Reset</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
